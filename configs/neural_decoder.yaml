# BuckyBrain Neural Decoder Configuration

# Dataset configuration
dataset:
  dataset_dir: /mnt/dv/wid/projects3/Rogers-nsf-ind-diff/zihan/brain2text/nejm-brain-to-text/data/hdf5_data_final
  
  # Session specification (set to null for auto-discovery)
  # sessions_train: null  # null = auto-discover, or list specific sessions for debugging
  sessions_train: 
    - t15.2023.08.11
    - t15.2023.08.13
    - t15.2023.08.18
    - t15.2023.08.20


  # sessions_val: null    # null = auto-discover
  sessions_val:
    - t15.2023.08.13

  exclude_sessions: []  # Sessions to exclude from auto-discovery
  auto_discover: false   # Use auto-discovery even if sessions specified
  
  # For debugging, you can specify a subset like:
  # sessions_train: ['t15.2023.08.11', 't15.2023.08.13', 't15.2023.08.18']
  # sessions_val: ['t15.2023.08.11']

# Model architecture
model:
  n_units: 768          # GRU hidden units per layer
  n_layers: 5           # Number of GRU layers
  rnn_dropout: 0.4      # Dropout between GRU layers
  input_dropout: 0.2    # Dropout after day-specific layer
  patch_size: 14        # Temporal patch size (0=disabled)
  patch_stride: 4       # Stride for temporal patching

# Training configuration
training:
  batch_size: 64
  days_per_batch: 4     # Number of different days per training batch
  # n_train_batches: 120000  # Total training batches
  n_train_batches: 20000  # Total training batches
  val_every: 500       # Validate every N batches

# Optimizer configuration
optimizer:
  lr: 0.003             # Base learning rate
  lr_min: 0.0001        # Minimum LR (for scheduler)
  lr_day: 0.002         # Learning rate for day-specific layers
  weight_decay: 0.001   # L2 regularization
  weight_decay_day: 0.0 # L2 for day layers (typically 0)
  grad_clip: 10.0       # Gradient clipping threshold

# Data augmentation
augmentation:
  white_noise_std: 1.0
  constant_offset_std: 0.2
  random_walk_std: 0.0
  static_gain_std: 0.0
  random_cut: 3         # Max timesteps to cut from start
  smooth_data: true
  smooth_kernel_std: 2

# System configuration
system:
  output_dir: ./outputs
  amp: true             # Automatic mixed precision
  use_compile: false    # torch.compile (requires PyTorch 2.0+)
  seed: 42
  gpu: 0                # GPU index (-1 for CPU)

